<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Button Animation Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0E12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .waveform-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .mic-button {
            position: relative;
            z-index: 10;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #16181D;
            border: 4px solid #3B82F6;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .mic-button:hover {
            transform: scale(1.05);
        }

        .mic-button.active {
            border-color: #10B981;
        }

        .mic-icon {
            width: 64px;
            height: 64px;
            fill: #3B82F6;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
        }

        .mic-button.active .mic-icon {
            fill: white;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.8));
        }

        .central-glow {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3), transparent 60%);
            filter: blur(30px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mic-button.active ~ .central-glow {
            opacity: 1;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            background: #3B82F6;
            box-shadow: 0 0 15px #3B82F6;
            pointer-events: none;
            opacity: 0.4;
        }

        .mic-button.active ~ .orb {
            opacity: 0.8;
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(var(--x), var(--y)) scale(1); }
            50% { transform: translate(calc(var(--x) + 20px), calc(var(--y) + 20px)) scale(1.5); }
        }

        .controls {
            position: absolute;
            bottom: 50px;
            display: flex;
            gap: 20px;
        }

        button {
            padding: 12px 24px;
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid rgba(59, 130, 246, 0.5);
            color: #3B82F6;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: #3B82F6;
            transform: scale(1.05);
        }

        button.active {
            background: rgba(59, 130, 246, 0.3);
            border-color: #3B82F6;
        }

        .status-text {
            position: absolute;
            top: 50px;
            color: #9CA3AF;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }

        .status-text.active {
            color: #3B82F6;
            animation: statusPulse 1.5s infinite;
        }

        @keyframes statusPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="status-text" id="statusText">Click to activate voice</div>
    
    <div class="container">
        <svg class="waveform-container" viewBox="-300 -300 600 600">
            <!-- Outer glow ring -->
            <circle cx="0" cy="0" r="160" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.2" id="outerRing"/>
            
            <!-- Waveform bars -->
            <g id="waveformBars"></g>
            
            <!-- Inner circle -->
            <circle cx="0" cy="0" r="130" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.3" id="innerCircle"/>
            
            <!-- Rotating particles -->
            <circle cx="130" cy="0" r="4" fill="#3B82F6" opacity="0.6" id="particle1">
                <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
            </circle>
            <circle cx="-65" cy="112.5" r="4" fill="#3B82F6" opacity="0.6" id="particle2">
                <animateTransform attributeName="transform" type="rotate" from="120 0 0" to="480 0 0" dur="4s" repeatCount="indefinite"/>
            </circle>
            <circle cx="-65" cy="-112.5" r="4" fill="#3B82F6" opacity="0.6" id="particle3">
                <animateTransform attributeName="transform" type="rotate" from="240 0 0" to="600 0 0" dur="4s" repeatCount="indefinite"/>
            </circle>
        </svg>

        <div class="mic-button" id="micButton">
            <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
        </div>

        <div class="central-glow"></div>
        
        <!-- Floating orbs -->
    </div>

    <div class="controls">
        <button id="toggleBtn">Start Listening</button>
        <button id="audioBtn">Simulate Audio</button>
    </div>

    <script>
        const micButton = document.getElementById('micButton');
        const toggleBtn = document.getElementById('toggleBtn');
        const audioBtn = document.getElementById('audioBtn');
        const statusText = document.getElementById('statusText');
        const waveformBars = document.getElementById('waveformBars');
        const container = document.querySelector('.container');
        
        let isActive = false;
        let audioLevel = 0;
        let audioSimulation = null;

        // Create waveform bars
        const barCount = 60;
        const radius = 140;
        
        for (let i = 0; i < barCount; i++) {
            const angle = (i / barCount) * Math.PI * 2;
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            
            const x1 = Math.cos(angle) * radius;
            const y1 = Math.sin(angle) * radius;
            const x2 = Math.cos(angle) * (radius + 5);
            const y2 = Math.sin(angle) * (radius + 5);
            
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', '#3B82F6');
            line.setAttribute('stroke-width', '3');
            line.setAttribute('stroke-linecap', 'round');
            line.setAttribute('opacity', '0.2');
            line.setAttribute('data-index', i);
            
            waveformBars.appendChild(line);
        }

        // Create floating orbs
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const distance = 200 + (i % 3) * 50;
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;
            const size = 4 + Math.random() * 6;
            
            const orb = document.createElement('div');
            orb.className = 'orb';
            orb.style.width = size + 'px';
            orb.style.height = size + 'px';
            orb.style.left = '50%';
            orb.style.top = '50%';
            orb.style.setProperty('--x', x + 'px');
            orb.style.setProperty('--y', y + 'px');
            orb.style.transform = `translate(${x * 0.7}px, ${y * 0.7}px)`;
            orb.style.animationDelay = (i * 0.2) + 's';
            
            container.appendChild(orb);
        }

        // Animate waveform bars
        function animateWaveform() {
            const bars = waveformBars.querySelectorAll('line');
            const time = Date.now() * 0.003;
            
            bars.forEach((bar, i) => {
                const angle = (i / barCount) * Math.PI * 2;
                let barHeight = 5;
                
                if (isActive) {
                    const wave = 0.5 + Math.sin(i * 0.3 + time) * 0.5;
                    barHeight = 15 + (audioLevel / 100) * 40 * wave;
                    bar.setAttribute('opacity', 0.4 + wave * 0.4);
                } else {
                    bar.setAttribute('opacity', '0.2');
                }
                
                const x2 = Math.cos(angle) * (radius + barHeight);
                const y2 = Math.sin(angle) * (radius + barHeight);
                
                bar.setAttribute('x2', x2);
                bar.setAttribute('y2', y2);
            });
            
            requestAnimationFrame(animateWaveform);
        }

        animateWaveform();

        // Toggle active state
        toggleBtn.addEventListener('click', () => {
            isActive = !isActive;
            micButton.classList.toggle('active');
            statusText.classList.toggle('active');
            toggleBtn.classList.toggle('active');
            
            if (isActive) {
                toggleBtn.textContent = 'Stop Listening';
                statusText.textContent = '🎤 LISTENING...';
            } else {
                toggleBtn.textContent = 'Start Listening';
                statusText.textContent = 'Click to activate voice';
                audioLevel = 0;
                if (audioSimulation) {
                    clearInterval(audioSimulation);
                    audioSimulation = null;
                }
                audioBtn.classList.remove('active');
                audioBtn.textContent = 'Simulate Audio';
            }
        });

        // Simulate audio input
        audioBtn.addEventListener('click', () => {
            if (audioSimulation) {
                clearInterval(audioSimulation);
                audioSimulation = null;
                audioLevel = 0;
                audioBtn.classList.remove('active');
                audioBtn.textContent = 'Simulate Audio';
            } else {
                if (!isActive) {
                    toggleBtn.click();
                }
                audioBtn.classList.add('active');
                audioBtn.textContent = 'Stop Audio';
                
                audioSimulation = setInterval(() => {
                    audioLevel = 30 + Math.random() * 70;
                }, 100);
            }
        });
    </script>
</body>
</html>
