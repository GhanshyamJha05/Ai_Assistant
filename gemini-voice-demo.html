<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Voice Interface Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(138, 180, 248, 0.3);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 90%;
            padding: 3rem;
            text-align: center;
        }

        .header {
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4285f4 0%, #8ab4f8 50%, #aecbfa 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(66, 133, 244, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 32px rgba(66, 133, 244, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 12px 40px rgba(66, 133, 244, 0.5);
            }
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4285f4, #8ab4f8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #8ab4f8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #adb5bd;
            font-size: 1.1rem;
            font-weight: 400;
        }

        .voice-interface {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 4rem 3rem;
            margin-bottom: 2rem;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .waveform-container {
            position: relative;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 2rem 0;
        }

        .wave-bar {
            width: 8px;
            background: linear-gradient(180deg, #4285f4 0%, #8ab4f8 100%);
            border-radius: 8px;
            transition: all 0.15s ease;
            box-shadow: 0 0 20px rgba(66, 133, 244, 0.5);
        }

        .status-text {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #fff;
            transition: all 0.3s ease;
        }

        .instruction-text {
            color: #adb5bd;
            font-size: 1rem;
            margin-top: 1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .btn {
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Google Sans', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4285f4 0%, #8ab4f8 100%);
            color: #fff;
            box-shadow: 0 8px 24px rgba(66, 133, 244, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(66, 133, 244, 0.6);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .response-area {
            margin-top: 2rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 100px;
            animation: fadeInUp 0.8s ease 0.6s both;
        }

        .response-text {
            color: #e9ecef;
            font-size: 1.1rem;
            line-height: 1.6;
            font-weight: 300;
        }

        .state-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .state-idle { background: #6c757d; animation: none; }
        .state-listening { background: #4285f4; }
        .state-processing { background: #fbbc04; }
        .state-speaking { background: #34a853; }

        /* Microphone button center piece */
        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4285f4 0%, #8ab4f8 100%);
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(66, 133, 244, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2rem auto;
            position: relative;
        }

        .mic-button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 48px rgba(66, 133, 244, 0.6);
        }

        .mic-button:active {
            transform: scale(1.05);
        }

        .mic-button.active {
            animation: pulseRing 1.5s ease-in-out infinite;
        }

        @keyframes pulseRing {
            0% {
                box-shadow: 0 0 0 0 rgba(66, 133, 244, 0.7);
            }
            70% {
                box-shadow: 0 0 0 30px rgba(66, 133, 244, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(66, 133, 244, 0);
            }
        }

        .mic-icon {
            width: 48px;
            height: 48px;
            fill: white;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .voice-interface {
                padding: 2rem 1.5rem;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
                        <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
                    </svg>
                </div>
                <div class="logo-text">Gemini</div>
            </div>
            <h1>Voice Interface Demo</h1>
            <p class="subtitle">Experience the future of conversational AI</p>
        </div>

        <div class="voice-interface">
            <div class="status-text" id="statusText">
                <span class="state-indicator state-idle" id="stateIndicator"></span>
                <span id="statusLabel">Ready to listen</span>
            </div>

            <button class="mic-button" id="micButton">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>

            <div class="waveform-container" id="waveform"></div>

            <p class="instruction-text">Click the microphone or try the demo states below</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="simulateListening()">
                <span>🎤 Listening State</span>
            </button>
            <button class="btn btn-primary" onclick="simulateProcessing()">
                <span>⚙️ Processing State</span>
            </button>
            <button class="btn btn-primary" onclick="simulateSpeaking()">
                <span>💬 Speaking State</span>
            </button>
            <button class="btn btn-secondary" onclick="resetState()">
                <span>↺ Reset</span>
            </button>
        </div>

        <div class="response-area">
            <p class="response-text" id="responseText">
                Your conversation will appear here. Try clicking one of the demo buttons above to see different interface states!
            </p>
        </div>
    </div>

    <script>
        // Create animated background particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }

        // Create waveform bars
        const waveform = document.getElementById('waveform');
        const barCount = 20;
        const bars = [];

        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            bar.style.height = '20px';
            waveform.appendChild(bar);
            bars.push(bar);
        }

        let animationFrame;
        let currentState = 'idle';

        function animateWaveform(intensity = 1, speed = 1) {
            const animate = () => {
                bars.forEach((bar, index) => {
                    const time = Date.now() * speed * 0.001;
                    const offset = index * 0.3;
                    const height = 20 + Math.sin(time + offset) * 80 * intensity;
                    bar.style.height = height + 'px';
                    bar.style.opacity = 0.5 + (height / 200) * 0.5;
                });
                animationFrame = requestAnimationFrame(animate);
            };
            animate();
        }

        function stopWaveform() {
            cancelAnimationFrame(animationFrame);
            bars.forEach(bar => {
                bar.style.height = '20px';
                bar.style.opacity = '0.3';
            });
        }

        function updateStatus(state, label, message) {
            currentState = state;
            const stateIndicator = document.getElementById('stateIndicator');
            const statusLabel = document.getElementById('statusLabel');
            const responseText = document.getElementById('responseText');
            const micButton = document.getElementById('micButton');
            
            stateIndicator.className = 'state-indicator state-' + state;
            statusLabel.textContent = label;
            responseText.textContent = message;

            if (state === 'idle') {
                micButton.classList.remove('active');
            } else {
                micButton.classList.add('active');
            }
        }

        function simulateListening() {
            updateStatus('listening', 'Listening...', 'I\'m listening to your voice input. The waveform responds to audio levels in real-time.');
            animateWaveform(0.8, 2);
        }

        function simulateProcessing() {
            updateStatus('processing', 'Processing...', 'Analyzing your request and preparing a response using advanced AI models...');
            animateWaveform(0.4, 1);
            
            setTimeout(() => {
                simulateSpeaking();
            }, 2000);
        }

        function simulateSpeaking() {
            updateStatus('speaking', 'Speaking...', 'Here\'s my response: The Gemini voice interface uses real-time audio processing, natural language understanding, and text-to-speech synthesis to create a seamless conversational experience.');
            animateWaveform(1, 1.5);
            
            setTimeout(() => {
                resetState();
            }, 5000);
        }

        function resetState() {
            updateStatus('idle', 'Ready to listen', 'Your conversation will appear here. Try clicking one of the demo buttons above to see different interface states!');
            stopWaveform();
        }

        // Microphone button interaction
        document.getElementById('micButton').addEventListener('click', () => {
            if (currentState === 'idle') {
                simulateListening();
                setTimeout(() => {
                    simulateProcessing();
                }, 3000);
            } else {
                resetState();
            }
        });

        // Initial idle animation
        stopWaveform();
    </script>
</body>
</html>
